<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport"
        content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1.00001,viewport-fit=cover" />
  <title>DemoMaths</title>

  <style>
    #root, body, html {
      width: 100%;
      -webkit-overflow-scrolling: touch;
      margin: 0;
      padding: 0;
      min-height: 100%;
    }
    #root { flex-shrink: 0; flex-basis: auto; flex-grow: 1; display: flex; flex: 1; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; height: calc(100% + env(safe-area-inset-top)); }
    body {
      display: flex; overflow-y: auto; overscroll-behavior-y: none;
      text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale; -ms-overflow-style: scrollbar;
    }
  </style>

  <!-- ✅ Favicons -->
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

  <!-- ✅ Apple / iOS -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- ✅ PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">

  <!-- ✅ Police MaterialCommunityIcons (CDN) -->
  <link rel="preload"
        href="https://cdn.jsdelivr.net/npm/@expo/vector-icons@13.0.0/build/vendor/react-native-vector-icons/MaterialCommunityIcons.ttf"
        as="font" type="font/ttf" crossorigin />

  <style>
    /* Déclaration CSS (1er filet) */
    @font-face {
      font-family: "MaterialCommunityIcons";
      src: url("https://cdn.jsdelivr.net/npm/@expo/vector-icons@13.0.0/build/vendor/react-native-vector-icons/MaterialCommunityIcons.ttf")
           format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
  </style>

  <!-- JS -->
  <script defer src="static/js/775.e88d0e4b.js"></script>
  <script defer src="static/js/main.78bf0fee.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="static/css/775.a3f350f7.css" />

  <!-- FORCE la bonne police MaterialCommunityIcons (écrase la règle du bundle) -->
<link rel="preload"
      href="https://cdn.jsdelivr.net/npm/@expo/vector-icons@13.0.0/build/vendor/react-native-vector-icons/MaterialCommunityIcons.ttf"
      as="font" type="font/ttf" crossorigin="anonymous" />

<style>
/* même nom de famille pour écraser la règle précédente */
@font-face {
  font-family: "MaterialCommunityIcons";
  src: url("https://cdn.jsdelivr.net/npm/@expo/vector-icons@13.0.0/build/vendor/react-native-vector-icons/MaterialCommunityIcons.ttf")
       format("truetype");
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

/* assure que les éléments utilisent bien cette fonte (utile si une autre règle CSS force autre chose) */
[class*="material-community"], [class*="MaterialCommunityIcons"] {
  font-family: "MaterialCommunityIcons" !important;
}
</style>


  <!-- Charger explicitement la fonte via l’API FontFace (2e filet) -->
  <script>
    (function () {
      var url = "https://cdn.jsdelivr.net/npm/@expo/vector-icons@13.0.0/build/vendor/react-native-vector-icons/MaterialCommunityIcons.ttf";
      try {
        var f = new FontFace("MaterialCommunityIcons", "url(" + url + ") format('truetype')", {
          style: "normal",
          weight: "400",
          display: "swap"
        });
        f.load().then(function(loaded) {
          document.fonts.add(loaded);
          // Optionnel : forcer un reflow pour que la barre d’onglets se ré-affiche avec les glyphes
          document.documentElement.classList.add('mci-loaded');
        }).catch(function(e){
          console.warn("MaterialCommunityIcons FontFace load error:", e);
        });
      } catch (e) {
        // vieux navigateurs : se reposer sur @font-face
        console.warn("FontFace API not available, falling back to @font-face.");
      }
    })();
  </script>
</head>
<body>
  <noscript>
    <form action="" style="background-color:#fff;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999">
      <div style="font-size:18px;font-family:Helvetica,sans-serif;line-height:24px;margin:10%;width:80%">
        <p>Oh no! It looks like JavaScript is not enabled in your browser.</p>
        <p style="margin:20px 0">
          <button type="submit"
                  style="background-color:#4630eb;border-radius:100px;border:none;box-shadow:none;color:#fff;
                         cursor:pointer;font-weight:700;line-height:20px;padding:6px 16px">
            Reload
          </button>
        </p>
      </div>
    </form>
  </noscript>
  <div id="root"></div>
</body>
</html>
