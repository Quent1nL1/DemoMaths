<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport"
        content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1.00001,viewport-fit=cover" />
  <title>DemoMaths</title>

  <style>
    /* base layout */
    #root, body, html { width:100%; margin:0; padding:0; min-height:100% }
    #root { flex-shrink:0; flex-basis:auto; flex-grow:1; display:flex; flex:1 }
    html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; height:calc(100% + env(safe-area-inset-top)) }
    body {
      display:flex; overflow-y:auto; overscroll-behavior-y:none;
      text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale; -ms-overflow-style:scrollbar;
    }
  </style>

  <!-- Favicons / PWA -->
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">

  <!-- JS & CSS de l'app -->
  <script defer src="static/js/775.e88d0e4b.js"></script>
  <script defer src="static/js/main.78bf0fee.js"></script>
  <link rel="stylesheet" href="static/css/775.a3f350f7.css" />

  <!-- ✅ Force la police locale attendue par react-native-vector-icons / expo -->
  <link rel="preload" href="MaterialCommunityIcons.ttf" as="font" type="font/ttf" crossorigin="anonymous">

  <style>
    /* Règle @font-face locale (pas de CDN => pas de CORS) */
    @font-face {
      font-family: "MaterialCommunityIcons";
      src: url("MaterialCommunityIcons.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    /* au cas où une règle du bundle change la famille */
    [class*="material-community"], [class*="MaterialCommunityIcons"], [style*="MaterialCommunityIcons"] {
      font-family: "MaterialCommunityIcons" !important;
    }
  </style>

  <!-- Double filet : charge explicitement la fonte locale via l’API FontFace -->
  <script>
    (async () => {
      try {
        if (document.fonts && !document.fonts.check('16px "MaterialCommunityIcons"')) {
          const f = new FontFace("MaterialCommunityIcons", "url(MaterialCommunityIcons.ttf) format('truetype')",
            { style: "normal", weight: "400", display: "swap" });
          const loaded = await f.load();
          document.fonts.add(loaded);
        }
      } catch (e) { /* on se repose sur @font-face */ }
    })();
  </script>
</head>
<body>
  <noscript>
    <form action="" style="background:#fff;position:fixed;inset:0;z-index:9999">
      <div style="font-size:18px;font-family:Helvetica,sans-serif;line-height:24px;margin:10%;width:80%">
        <p>Oh no! It looks like JavaScript is not enabled in your browser.</p>
        <p style="margin:20px 0">
          <button type="submit" style="background:#4630eb;border-radius:100px;border:none;color:#fff;font-weight:700;line-height:20px;padding:6px 16px">Reload</button>
        </p>
      </div>
    </form>
  </noscript>
  <div id="root"></div>
</body>
</html>
